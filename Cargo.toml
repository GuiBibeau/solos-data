[workspace]
resolver = "3"
members = ["crates/phoenix-codec", "crates/solana-wire", "crates/solos-data"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/GuiBibeau/solos-data"

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# DuckDB is C++; compile it optimized even for debug builds so tests run at production speed.
[profile.dev.package.libduckdb-sys]
opt-level = 3
