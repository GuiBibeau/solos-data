services:
  collector:
    image: solos-data:local
    build: .
    command: [solos-data, collector, run]
    environment:
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:?Load the RPC URL without printing it}
      SOLOS_DATA_CU_PER_SECOND: ${SOLOS_DATA_CU_PER_SECOND:-1000}
    volumes:
      - ./data/phoenix_raw:/data/raw
    restart: unless-stopped
    stop_grace_period: 60s
  decoder:
    image: solos-data:local
    build: .
    depends_on: [collector]
    # Reader leases use process IDs in a shared namespace.
    pid: service:collector
    volumes:
      - ./data/phoenix_raw:/data/raw:ro
      - ./data/phoenix_raw/.readers:/data/raw/.readers
      - ./data/phoenix_decoded:/data/decoded
    restart: unless-stopped
    stop_grace_period: 60s
