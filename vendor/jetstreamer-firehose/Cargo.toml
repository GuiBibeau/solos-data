# Vendored from https://github.com/anza-xyz/jetstreamer at 048d2cd (jetstreamer-firehose 0.7.0,
# MIT OR Apache-2.0, LICENSE-MIT and LICENSE-APACHE beside this file), for one change (ADR-0014,
# "Stalls"): `convert_proto_rewards` in src/firehose.rs skips a reward entry whose type it does not
# know instead of failing the block. From epoch 1065 the first block of an epoch carries reward
# entries of protobuf type 6, which 048d2cd and upstream main (ce2f367, 2026-10-09) reject; the
# thread then retried that block forever. Everything else is the upstream source minus the CLI
# binary (src/main.rs) and the tests directory; the manifest spells out the workspace versions of
# 048d2cd. Drop this directory and go back to the git dependency once upstream decodes or skips
# unknown reward types.
[package]
name = "jetstreamer-firehose"
description = "Support crate for Jetstreamer containing firehose ingestion engine and core abstractions"
edition = "2024"
version = "0.7.0"
authors = ["sam0x17", "anza-team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/anza-xyz/jetstreamer"
publish = false

[features]
default = []
verify-transaction-signatures = []

[dependencies]
crossbeam-channel = { version = "0", default-features = false }
serial_test = "4"
solana-rpc = "4"
solana-runtime = "4"
solana-hash = "4"
solana-geyser-plugin-manager = { version = "4", features = ["agave-unstable-api"] }
solana-storage-proto = "4"
solana-address = "2"
solana-transaction = { version = "4", features = ["wincode"] }
solana-message = { version = "4", features = ["wincode"] }
solana-transaction-status = "4"
solana-ledger = "4"
solana-signature = { version = "3", default-features = false }
solana-sdk-ids = "3"
solana-accounts-db = "4"
prost_014 = { package = "prost", version = "0.14" }
solana-entry = "4"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tokio = "1"
futures-util = { version = "0", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }
cid = "0"
multihash = { version = "0", default-features = false }
base64 = "0.22"
wincode = "0.5"
solana-logger = "3"
log = "0"
rseek = "0.4"
ripget = "0.3"
crc = "3"
serde_cbor = "0"
fnv = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false }
zstd = { version = "0.14", default-features = false }
solana-reward-info = "6"
bincode = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
ahash = "0.8"
dashmap = "6"
once_cell = "1"
url = { version = "2", default-features = false }
libc = "0"
