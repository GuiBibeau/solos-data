[package]
name = "solos-data"
description = "Phoenix perpetuals collector and decoder: one binary, the collector, decoder and dev command groups"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "solos-data"
path = "src/main.rs"

[dependencies]
phoenix-codec = { path = "../phoenix-codec" }
solana-wire = { path = "../solana-wire" }
duckdb = { version = "=1.4.5", features = ["bundled", "json", "parquet"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
bs58 = "0.5"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
signal-hook = "0.3"
nix = { version = "0.30", features = ["signal", "fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "stream"] }
# Binance public dumps are zip archives of one CSV; read-only use, deflate through flate2.
zip = { version = "6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# EDGAR answers gzip when asked; the lane inflates the body itself. Tests build gzip fixtures
# for the Bybit tick dumps with the same crate.
flate2 = "1"
# AWS SigV4 for the requester-pays Hyperliquid S3 archive (HMAC-SHA256) and its lz4 frames.
hmac = "0.12"
lz4 = "1.28"
# The Elfa Auto event stream is read through reqwest's `bytes_stream`.
futures-util = "0.3"
# Jetstreamer 048d2cd, vendored with one patch: reward entries of unknown type are skipped (ADR-0014).
jetstreamer-firehose = { path = "../../vendor/jetstreamer-firehose", optional = true }
solana-transaction-status = { version = "=4.2.2", optional = true }
wincode = { version = "0.5", optional = true }
# Jetstreamer reports retries and stalls through `log`; `SOLOS_DATA_ARCHIVE_LOG` forwards them.
log = { version = "0.4", optional = true }
# Pins that hold the agave graph on the 4.2 line Jetstreamer's lockfile uses (solana-transaction 4.1.6 / wincode 0.5).
solana-accounts-db = { version = "=4.2.2", optional = true }
solana-ledger = { version = "=4.2.2", optional = true }
solana-runtime = { version = "=4.2.2", optional = true }
solana-rpc = { version = "=4.2.2", optional = true }
solana-geyser-plugin-manager = { version = "=4.2.2", optional = true }
solana-storage-proto = { version = "=4.2.2", optional = true }
# Crash-safety failpoints (issue #56): kill points that abort the process. Off in release
# builds; integration tests enable the feature through the self dev-dependency below.
fail = { version = "0.5.1", features = ["failpoints"], optional = true }

[dev-dependencies]
# Enable `failpoints` for every test target without turning it on in release builds.
solos-data = { path = ".", features = ["failpoints"] }
# Test-only pins: borsh re-serializes decoded events for the codec-audit layout check, and toml
# reads Cargo.lock so the schema VERSION is tied to the resolved phoenix-rise-events version.
borsh = "1.7"
toml = "0.5"

[dev-dependencies]
# Property-based tests for the range checker (offline; no fork/timeout so cases run in-process).
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[features]
default = []
# The Old Faithful archive lane through Jetstreamer (heavy build: agave crates and RocksDB).
archive = ["dep:jetstreamer-firehose", "dep:log", "dep:solana-transaction-status", "dep:wincode", "dep:solana-accounts-db", "dep:solana-ledger", "dep:solana-runtime", "dep:solana-rpc", "dep:solana-geyser-plugin-manager", "dep:solana-storage-proto"]
# Crash-safety failpoints and the fsync failure injection used by the tests (issue #56).
failpoints = ["dep:fail"]

[lints]
workspace = true
