[package]
name = "solos-data"
description = "Phoenix perpetuals collector and decoder: one binary, the collector, decoder and dev command groups"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "solos-data"
path = "src/main.rs"

[dependencies]
phoenix-codec = { path = "../phoenix-codec" }
solana-wire = { path = "../solana-wire" }
duckdb = { version = "=1.4.5", features = ["bundled", "json", "parquet"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
bs58 = "0.5"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
signal-hook = "0.3"
nix = { version = "0.30", features = ["signal"] }

[lints]
workspace = true
