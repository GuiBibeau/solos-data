name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Nightly and manual runs keep the archive compile check (which no longer runs on
  # every PR) exercised; anything moved off PRs fails loudly here. Only pushes to main
  # save the caches, so a main merge is what keeps them warm.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run in flight; runs on main always finish so
# their caches are saved.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debuginfo in CI builds: same code, same opt-levels, same tests. DuckDB's C++ is then
  # compiled without -g, which is faster and makes its objects far smaller to cache. Local and
  # release builds keep the Cargo.toml profiles.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# `fmt`, `clippy` and `test` run in parallel; the wall clock is the slowest one. `cargo clippy`
# (check, dev profile) and `cargo test` (test profile) resolve different libduckdb-sys
# build-script units, so a shared target/ would still compile DuckDB twice: each Rust job keeps
# its own cache instead. `archive-check` compiles DuckDB plus RocksDB, protobuf and the agave
# crates, and keeps its own. `changes` computes the archive input set; `ci-ok` aggregates the
# results into the single check branch protection should require. `ci-self-check` runs the
# structural checks that need no DuckDB build.
#
# Every Rust job uses a shared cache key (Swatinem/rust-cache `shared-key`) with a main-only
# save: only pushes to main write the cache, while pull requests only restore.
# Swatinem/rust-cache's restore key omits the Cargo.lock hash, so a PR that changes the lockfile
# still restores main's warm cache and recompiles only the crates whose versions actually changed
# (ADR-0018).
jobs:
  # Computes the archive input set for pull requests. It always runs so downstream jobs can read
  # its outputs; the filter step itself only applies to pull requests, and on other events the
  # outputs are empty so every downstream job runs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      archive: ${{ steps.filter.outputs.archive }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            archive:
              # Everything that drives `cargo check -p solos-data --features archive`'s build
              # graph: the workspace and crate manifests, the lockfile, the pinned toolchain,
              # the solos-data crate and its in-repo path dependencies (phoenix-codec,
              # solana-wire, the vendored Jetstreamer crate), and this workflow itself.
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.toml'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
              - 'crates/solos-data/**'
              - 'crates/phoenix-codec/**'
              - 'crates/solana-wire/**'
              - 'vendor/**'

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: cargo fmt --all --check

  # Text lint: em-dashes and private host or path names, the two AGENTS.md rules
  # made machine-checkable. Node-only, no Rust toolchain and no npm install, so it
  # finishes in seconds and fails before any cargo work runs.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npm run lint:text

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: 1.96.0
          components: clippy
      # `shared-key` is the stable shared prefix (equal to the automatic job id, so existing
      # caches are reused); Swatinem's restore key omits the Cargo.lock hash, so a PR that
      # changes the lockfile still restores main's warm cache. Only main saves; PRs only restore.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # DuckDB's objects are already archived in libduckdb.a; drop them before the cache is saved.
      # The build script reruns only when its inputs change, so nothing reads them again.
      - name: Prune DuckDB objects before caching
        run: find target -path '*/build/libduckdb-sys-*/out/*' -name '*.o' -delete

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked
      # The npm suite runs on every push to main, and on a pull request that touches its inputs:
      # the TypeScript sources and tests, their config, the npm manifests, the lint script (whose
      # tests live under tests/), and the codec it spawns.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        if: github.event_name == 'pull_request'
        with:
          filters: |
            npm:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'config/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'crates/phoenix-codec/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: github.event_name != 'pull_request' || steps.changes.outputs.npm == 'true'
        with:
          node-version: 24
          cache: npm
      - if: github.event_name != 'pull_request' || steps.changes.outputs.npm == 'true'
        run: npm ci
      # Type check, the release codec binary the JS suite spawns, then the JS suite (offline, no
      # credentials). The Rust and codec tests already ran in the `cargo test` step above, so the
      # npm `codec:test` (a second `cargo test --workspace`) is not repeated here; verify.sh does
      # the same.
      - if: github.event_name != 'pull_request' || steps.changes.outputs.npm == 'true'
        run: npm run check && npm run codec:build && npm test
      - name: Prune DuckDB objects before caching
        run: find target -path '*/build/libduckdb-sys-*/out/*' -name '*.o' -delete

  # The archive feature (Jetstreamer, the agave crates, RocksDB) is otherwise compiled only by
  # the image build. Bindgen needs libclang. RocksDB, DuckDB and protobuf are C++: `clang` as
  # `c++` fails that configure (no libstdc++), so the job pins gcc/g++. `cargo clippy` would
  # compile the same graph again with clippy-driver, and incremental compilation is off, so
  # this job only type-checks.
  #
  # It runs on every push to main, nightly and manual dispatches, and on a pull request only
  # when the `changes` job says the diff touches the archive inputs. On those runs it restores
  # main's warm cache (see the shared-key note above), so the heavy C++ and agave crates are not
  # rebuilt from scratch. The whole job is gated, not just its steps, so a skipped archive check
  # is visible to the `ci-ok` aggregator instead of reporting green while compiling nothing.
  archive-check:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.archive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: 1.96.0
      - name: Install archive build dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang cmake libclang-dev pkg-config g++
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        id: cache
        with:
          shared-key: archive-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Record rust-cache
        run: echo "rust-cache hit=${{ steps.cache.outputs.cache-hit }}"
      - run: cargo check -p solos-data --features archive --locked
      # The static libraries already contain these objects. The build scripts rerun only when
      # their inputs change, so nothing reads the .o files again.
      - name: Prune native objects before caching
        run: |
          find target -path '*/build/libduckdb-sys-*/out/*' -name '*.o' -delete
          find target -path '*/build/librocksdb-sys-*/out/*' -name '*.o' -delete
          find target -path '*/build/protobuf-src-*/out/*' -name '*.o' -delete

  # Structural self-checks that need no DuckDB build: ci-ok coverage and the release dependency
  # graph. It keeps a cargo cache entry only for the registry index that `cargo tree` reads, so
  # the checks stay warm without compiling anything.
  ci-self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-self-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-ci.mjs
      - run: scripts/check-release-deps.sh

  # The single check branch protection should require. It always runs and iterates over every job
  # it needs, so a new job is aggregated by adding it to `needs` (scripts/check-ci.mjs fails when
  # a job is missing). A job may report `skipped` only when the ALLOWED_SKIPS map names it with
  # the condition that legitimizes the skip; today that is `archive-check` on a pull request that
  # touched no archive inputs. Every other non-success result fails.
  ci-ok:
    needs: [changes, fmt, clippy, test, lint, archive-check, ci-self-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          ARCHIVE_CHANGED: ${{ needs.changes.outputs.archive }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          # The skip map: "job: condition that legitimizes a skipped result". The loop below
          # reads the names; scripts/check-ci.mjs reads them back and fails when one does not
          # name a real job.
          ALLOWED_SKIPS: |-
            archive-check: pull request touched no archive inputs
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq .
          allowed_skips="$(printf '%s\n' "$ALLOWED_SKIPS" | sed -n 's/^\([^:]*\):.*/\1/p')"
          for job in $(echo "$NEEDS" | jq -r 'keys[]'); do
            result="$(echo "$NEEDS" | jq -r --arg j "$job" '.[$j].result')"
            if [ "$result" = "success" ]; then
              continue
            fi
            if [ "$result" = "skipped" ] && printf '%s\n' "$allowed_skips" | grep -qxF "$job"; then
              case "$job" in
                archive-check)
                  if [ "$IS_PR" = "true" ] && [ "$ARCHIVE_CHANGED" != "true" ]; then
                    echo "archive-check intentionally skipped: no archive inputs changed on this pull request"
                    continue
                  fi
                  ;;
              esac
            fi
            echo "required job '$job' did not succeed: $result" >&2
            exit 1
          done
          echo "ci-ok: all required jobs passed"
